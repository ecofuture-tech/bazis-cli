# What the package is for and how to use it, for tools and AI agents (see AGENTS.md).
# `import` paths and `check` ids are verified by tests/test_cli.py.

[package]
name = "bazis-cli"
summary = "the bazis command: creates, extends and audits Bazis products (backend and frontend) with Claude"
solves = [
    "create a Bazis product from a description of what it does: the backend, and its frontend made by bazis-front (specs, contract, screens, design, end-to-end tests)",
    "add a Bazis package to a project and set it up, in the backend and the frontend",
    "review a project against the guides and checks of its Bazis packages and of its frontend",
]
requires = ["bazis-mcp"]
pairs_well = ["bazis-front"]

[[extension_points]]
name = "bazis"
import = "bazis.contrib.cli.main.main"
use_when = "the command line entry point"

[[extension_points]]
name = "Task"
import = "bazis.contrib.cli.agent.Task"
use_when = "run the agent of a command from Python (bazis.contrib.cli.agent.run)"

[[pitfalls]]
text = "the agent spends API credits of the account of Claude Code; limit a run with --budget"

[[pitfalls]]
text = "the system checks run the project code with its .venv, also in a read-only audit: use bazis in trusted projects"

[[pitfalls]]
text = "the tests of a new project need PostgreSQL with PostGIS and Redis (.env); without them the agent only checks and migrates"

[[pitfalls]]
text = "bazis new builds the frontend by default and then needs Node.js 22.12 or newer with npm; --no-frontend builds only the backend, and bazis add bazis-front adds the frontend later"

[[pitfalls]]
text = "the contract and the end-to-end tests of the frontend need a migrated PostgreSQL database; roles, statuses and transits are data migrations, and the test users and records of the end-to-end tests come from manage.py e2e_data, the e2e data command recommended by bazis-front (E2E_PASSWORD)"

[[pitfalls]]
text = "BAZIS_FRONT_REQUIREMENT replaces the requirement of bazis-front in requirements.txt of a new product (a path to a wheel or a checkout, or a URL) to try a bazis-front that is not on PyPI"
